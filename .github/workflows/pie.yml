name: PIE integration
on:
  push:
    branches: [main]
    paths:
      [
        "apps/web/**",
        "scripts/build-pie-web.mjs",
        "src/pie/**",
        "prisma/**",
        "prisma.config.ts",
        "scripts/pie.mjs",
        "tests/boundary/pie*.test.ts",
        "tests/boundary/mcp/pie*.test.ts",
        "tests/conformance/pieCiSelection.test.ts",
        "scripts/ci/pie-tests.mjs",
        "package*.json",
        ".github/workflows/pie.yml",
      ]
  pull_request:
    paths:
      [
        "apps/web/**",
        "scripts/build-pie-web.mjs",
        "src/pie/**",
        "prisma/**",
        "prisma.config.ts",
        "scripts/pie.mjs",
        "tests/boundary/pie*.test.ts",
        "tests/boundary/mcp/pie*.test.ts",
        "tests/conformance/pieCiSelection.test.ts",
        "scripts/ci/pie-tests.mjs",
        "package*.json",
        ".github/workflows/pie.yml",
      ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_USER: pie
          POSTGRES_PASSWORD: pie_ci_fixture
          POSTGRES_DB: pie_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pie -d pie_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit locked npm dependencies against current advisories
        run: npm audit --audit-level=low
      - run: npm run pie:build
      - run: npm run pie:db:migrate
        env:
          PIE_DATABASE_URL: postgresql://pie:pie_ci_fixture@127.0.0.1:5432/pie_test
      - run: node node_modules/vitest/vitest.mjs run tests/boundary/pieRunPersistence.test.ts
        env:
          PIE_TEST_DATABASE_URL: postgresql://pie:pie_ci_fixture@127.0.0.1:5432/pie_test
      - run: npm run typecheck
      - run: npm run test:local -- tests/conformance/pieCiSelection.test.ts
      - run: node scripts/generate-third-party-inventory.mjs --check
      - run: node node_modules/vitest/vitest.mjs run tests/boundary/pieNodeResults.test.ts
      - run: node node_modules/vitest/vitest.mjs run tests/boundary/pieResourceJournal.test.ts
      - run: node node_modules/vitest/vitest.mjs run tests/boundary/pieDockerPlan.test.ts tests/boundary/pieDockerLifecycle.test.ts tests/boundary/pieDockerCommand.test.ts
      - name: Verify Docker sandbox with real Node fixture
        env:
          PIE_TEST_DATABASE_URL: postgresql://pie:pie_ci_fixture@127.0.0.1:5432/pie_test
        shell: bash
        run: |
          docker pull node:24.18.0-bookworm-slim
          export PIE_TEST_DOCKER_IMAGE="$(docker image inspect node:24.18.0-bookworm-slim --format '{{index .RepoDigests 0}}')"
          node node_modules/vitest/vitest.mjs run tests/boundary/pieDockerReal.test.ts tests/boundary/pieVerification.test.ts tests/boundary/pieResourceRecovery.test.ts tests/boundary/pieVerifyCli.test.ts tests/boundary/pieVerificationApi.test.ts tests/boundary/mcp/pieVerifyMcp.test.ts
      - name: Verify installed browser and panel
        run: |
          test -x /usr/bin/google-chrome
          node node_modules/vitest/vitest.mjs run tests/boundary/pieBrowserAuth.test.ts tests/boundary/pieWeb.test.ts tests/boundary/pieWebTrace.test.ts
        env:
          PIE_BROWSER_EXECUTABLE: /usr/bin/google-chrome
      - name: Select safe incremental PIE test lane
        env:
          PIE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          PIE_HEAD_SHA: ${{ github.sha }}
          PIE_EVENT_NAME: ${{ github.event_name }}
          PIE_TEST_DATABASE_URL: postgresql://pie:pie_ci_fixture@127.0.0.1:5432/pie_test
        run: node scripts/ci/pie-tests.mjs
